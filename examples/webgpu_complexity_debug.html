<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - complexity debug views</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - complexity debug views">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_complexity_debug.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_complexity_debug.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Complexity Debug Views</span>
			</div>

			<small>
				<span id="view-label">Shaded</span><br/>
				Keys: 1 shaded, 2 shader complexity, 3 lighting complexity.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			// WITH_GENESYS
			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			let camera, scene, renderer;
			const viewLabel = document.getElementById( 'view-label' );

			const views = {
				'1': { view: 'none', label: 'Shaded' },
				'2': { view: 'shaderComplexity', label: 'Shader complexity' },
				'3': { view: 'lightingComplexity', label: 'Lighting complexity' }
			};

			init();

			function makeMap( r, g, b ) {

				const data = new Uint8Array( [
					r, g, b, 255,
					255 - r, 255 - g, 255 - b, 255,
					g, b, r, 255,
					b, r, g, 255
				] );
				const texture = new THREE.DataTexture( data, 2, 2 );
				texture.colorSpace = THREE.SRGBColorSpace;
				texture.needsUpdate = true;
				texture.wrapS = THREE.RepeatWrapping;
				texture.wrapT = THREE.RepeatWrapping;
				return texture;

			}

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 40 );
				camera.position.set( 4.5, 3.2, 6.5 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );

				const hemi = new THREE.HemisphereLight( 0xffffff, 0x223344, 0.15 );
				scene.add( hemi );

				const sun = new THREE.DirectionalLight( 0xffffff, 2.5 );
				sun.position.set( 4, 8, 2 );
				sun.castShadow = true;
				sun.shadow.mapSize.set( 1024, 1024 );
				scene.add( sun );

				const colors = [ 0xff4422, 0x44aaff, 0x66ff66, 0xffcc33 ];

				colors.forEach( ( color, index ) => {

					const light = new THREE.PointLight( color, 12, 5 );
					const angle = index / colors.length * Math.PI * 2;
					light.position.set( Math.cos( angle ) * 2.2, 1.2, Math.sin( angle ) * 2.2 );
					scene.add( light );

				} );

				const ground = new THREE.Mesh(
					new THREE.PlaneGeometry( 12, 12 ),
					new THREE.MeshStandardNodeMaterial( { color: 0x666666, roughness: 0.9 } )
				);
				ground.rotation.x = - Math.PI / 2;
				ground.receiveShadow = true;
				scene.add( ground );

				const cheap = new THREE.Mesh(
					new THREE.BoxGeometry( 1.2, 1.2, 1.2 ),
					new THREE.MeshStandardNodeMaterial( { color: 0xc8d0d8, roughness: 0.45, metalness: 0.05 } )
				);
				cheap.position.set( - 1.6, 0.6, 0.2 );
				cheap.castShadow = true;
				cheap.receiveShadow = true;
				scene.add( cheap );

				const heavy = new THREE.Mesh(
					new THREE.SphereGeometry( 0.7, 48, 32 ),
					new THREE.MeshPhysicalNodeMaterial( {
						color: 0x88ccee,
						roughness: 0.15,
						metalness: 0,
						transmission: 1,
						thickness: 0.8,
						clearcoat: 1,
						clearcoatRoughness: 0.1,
						map: makeMap( 180, 220, 255 ),
						roughnessMap: makeMap( 40, 40, 40 ),
						metalnessMap: makeMap( 0, 0, 0 ),
						aoMap: makeMap( 200, 200, 200 ),
						emissiveMap: makeMap( 20, 30, 40 )
					} )
				);
				heavy.position.set( 1.5, 0.7, 0.3 );
				heavy.castShadow = true;
				heavy.receiveShadow = true;
				scene.add( heavy );

				for ( let i = 0; i < 3; i ++ ) {

					const plane = new THREE.Mesh(
						new THREE.PlaneGeometry( 1.4, 1.4 ),
						new THREE.MeshStandardNodeMaterial( {
							color: 0xffffff,
							transparent: true,
							opacity: 0.35,
							depthWrite: false,
							roughness: 0.4
						} )
					);
					plane.position.set( 0.1, 1.1, - 0.4 + i * 0.18 );
					plane.receiveShadow = true;
					scene.add( plane );

				}

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.shadowMap.enabled = true;
				renderer.setAnimationLoop( render );
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0.6, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );
				window.addEventListener( 'keydown', onKeyDown );

				await renderer.init();

			}

			function onKeyDown( event ) {

				const next = views[ event.key ];

				if ( next === undefined || renderer === undefined ) return;

				renderer.debug.view = next.view;
				viewLabel.textContent = next.label;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				renderer.render( scene, camera );

			}
			// !WITH_GENESYS

		</script>
	</body>
</html>
