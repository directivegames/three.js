name: Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump (ignored when next_version is set)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      next_version:
        description: 'Optional next version (major, major.minor, or major.minor.patch). Overrides bump_type when set. Use 0.NNN.1 after merging upstream rNNN. For a hotfix of an older line, set this to 0.NNN.x (must be greater than the last tag on that line, not latest).'
        required: false
        type: string
      tag:
        description: 'npm dist-tag (leave empty for latest). Use rNNN for an older-line hotfix so latest is unchanged.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'
          provenance: false

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # WITH_GENESYS
      - name: Install bump CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/bump-cli" --silent commander tsx
          ln -sfn "$RUNNER_TEMP/bump-cli/node_modules" "$GITHUB_WORKSPACE/scripts/node_modules"

      - name: Bump version
        id: bump-version
        env:
          NEXT_VERSION: ${{ github.event.inputs.next_version }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          set -euo pipefail
          ARGS=(".")
          if [ -n "${NEXT_VERSION:-}" ]; then
            ARGS+=(--next-version "$NEXT_VERSION")
          else
            ARGS+=("$BUMP_TYPE")
          fi
          "$RUNNER_TEMP/bump-cli/node_modules/.bin/tsx" scripts/bump-package-version.ts "${ARGS[@]}"
      # !WITH_GENESYS

      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            echo "tag=--tag $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        run: npm run build

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run tests
        run: npm test

      # WITH_GENESYS
      # Publish from a staging directory so package self-import rewrites never dirty the checkout.
      - name: Prepare and publish package
        id: publish-package
        run: |
          set -euo pipefail
          attempt=1
          while true; do
            STAGING_DIR="$RUNNER_TEMP/three-publish"
            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"

            npm pack --pack-destination "$STAGING_DIR"
            TARBALL=$(printf '%s\n' "$STAGING_DIR"/*.tgz)
            tar -xzf "$TARBALL" -C "$STAGING_DIR"

            node utils/publish/rewrite-addon-imports.js "$STAGING_DIR/package"
            if npm publish "$STAGING_DIR/package" --access public --provenance=false ${{ steps.dist-tag.outputs.tag }}; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after ${attempt} attempts"
              exit 1
            fi
            echo "Publish failed; bumping patch from local version (attempt ${attempt})"
            "$RUNNER_TEMP/bump-cli/node_modules/.bin/tsx" scripts/bump-package-version.ts . patch --from-local
            attempt=$((attempt + 1))
          done
          echo "published_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag published version
        uses: ./.github/actions/push-git-tag
        with:
          tag: ${{ steps.bump-version.outputs.package_name }}/${{ steps.publish-package.outputs.published_version }}
          message: Publish ${{ steps.bump-version.outputs.package_name }}@${{ steps.publish-package.outputs.published_version }} to npm
      # !WITH_GENESYS

      - name: Verify published package
        run: |
          PACKAGE_NAME="${{ steps.bump-version.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.publish-package.outputs.published_version }}"

          # Create temp directory and try installing
          TEMP_DIR=$(mktemp -d)
          echo "Created temp directory: $TEMP_DIR"

          cd "$TEMP_DIR"
          npm init -y

          # Retry npm install until the package is available (registry propagation can lag).
          # Install by tag when provided, otherwise by exact version.
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            INSTALL_SPEC="$PACKAGE_NAME@$TAG"
          else
            INSTALL_SPEC="$PACKAGE_NAME@$PACKAGE_VERSION"
          fi
          echo "Waiting for $INSTALL_SPEC to be available on npm registry..."
          for i in {1..100}; do
            if npm install "$INSTALL_SPEC" 2>/dev/null; then
              echo "Package available and installed on attempt $i"
              break
            fi
            echo "Attempt $i: Package not yet available, waiting 5s..."
            sleep 5
            if [ "$i" -eq 100 ]; then
              echo "❌ Package never became available after 100 attempts"
              exit 1
            fi
          done

          # Verify installation succeeded
          NODE_MODULES_PATH="node_modules/$PACKAGE_NAME"
          if [ -d "$NODE_MODULES_PATH" ]; then
            INSTALLED_VERSION=$(node -p "require('./$NODE_MODULES_PATH/package.json').version")
            if [ "$INSTALLED_VERSION" == "$PACKAGE_VERSION" ]; then
              echo "✅ Successfully verified installation of $PACKAGE_NAME@$INSTALLED_VERSION"
            else
              echo "❌ Version mismatch: expected $PACKAGE_VERSION, got $INSTALLED_VERSION"
              exit 1
            fi
          else
            echo "❌ Package was not installed correctly"
            exit 1
          fi

          # WITH_GENESYS
          # Install a competing bare `three` alias to reproduce a multi-version consumer.
          # An untransformed addon would resolve this older package instead of its own release.
          npm install "three@npm:@gnsx/three@0.184.20"

          # Verify addons and the TSL entry point use the scoped package's exact module instance.
          PACKAGE_NAME="$PACKAGE_NAME" node --input-type=module <<'NODE'
          const THREE = await import(process.env.PACKAGE_NAME);
          const TSL = await import(`${process.env.PACKAGE_NAME}/tsl`);
          const WEBGPU = await import(`${process.env.PACKAGE_NAME}/webgpu`);
          const { GLTFLoader } = await import(`${process.env.PACKAGE_NAME}/addons/loaders/GLTFLoader.js`);

          if (!(new GLTFLoader() instanceof THREE.Loader)) {
            throw new Error('Published addon resolved a different Three.js module instance.');
          }
          if (TSL.If !== WEBGPU.TSL.If) {
            throw new Error('Published TSL entry point resolved a different WebGPU module instance.');
          }
          NODE
          # !WITH_GENESYS

          # Cleanup
          cd -
          rm -rf "$TEMP_DIR"

      - name: Notify Slack
        if: always()
        run: |
          # Determine overall status
          JOB_STATUS="${{ job.status }}"
          PACKAGE_NAME="${{ steps.bump-version.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.publish-package.outputs.published_version }}"
          if [ -z "$PACKAGE_VERSION" ]; then
            PACKAGE_VERSION="${{ steps.bump-version.outputs.new_version }}"
          fi

          if [ "$JOB_STATUS" == "success" ]; then
            OVERALL_STATUS="✅ *$PACKAGE_NAME Publish Succeeded!*"
            COLOR="good"
          else
            OVERALL_STATUS="❌ *$PACKAGE_NAME Publish Failed!*"
            COLOR="danger"
          fi

          # Get commit info
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_SHA=$(git rev-parse --short HEAD)

          curl -X POST "${{ secrets.GENESYS_SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [
                {
                  \"color\": \"$COLOR\",
                  \"title\": \"$OVERALL_STATUS\",
                  \"text\": \"$PACKAGE_NAME publish workflow completed\",
                  \"fields\": [
                    {
                      \"title\": \"Version\",
                      \"value\": \"$PACKAGE_VERSION\",
                      \"short\": true
                    },
                    {
                      \"title\": \"Status\",
                      \"value\": \"$JOB_STATUS\",
                      \"short\": true
                    },
                    {
                      \"title\": \"Commit\",
                      \"value\": \"<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|$COMMIT_SHA: $COMMIT_MSG>\",
                      \"short\": false
                    },
                    {
                      \"title\": \"Author\",
                      \"value\": \"$COMMIT_AUTHOR\",
                      \"short\": true
                    }
                  ],
                  \"footer\": \"GitHub Actions\",
                  \"footer_icon\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                  \"actions\": [
                    {
                      \"type\": \"button\",
                      \"text\": \"View Workflow\",
                      \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"
