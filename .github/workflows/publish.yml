name: Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump (ignored when next_version is set)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      next_version:
        description: 'Optional next version (major, major.minor, or major.minor.patch). Overrides bump_type when set. Use 0.NNN.1 after merging upstream rNNN. For a hotfix of an older line, set this to 0.NNN.x (must be greater than the last tag on that line, not latest).'
        required: false
        type: string
      tag:
        description: 'npm dist-tag (leave empty for latest). Use rNNN for an older-line hotfix so latest is unchanged.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'
          provenance: false

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # WITH_GENESYS
      - name: Install bump CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/bump-cli" --silent commander tsx
          ln -sfn "$RUNNER_TEMP/bump-cli/node_modules" "$GITHUB_WORKSPACE/scripts/node_modules"

      - name: Bump version
        id: bump-version
        env:
          NEXT_VERSION: ${{ github.event.inputs.next_version }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          set -euo pipefail
          ARGS=(".")
          if [ -n "${NEXT_VERSION:-}" ]; then
            ARGS+=(--next-version "$NEXT_VERSION")
          else
            ARGS+=("$BUMP_TYPE")
          fi
          "$RUNNER_TEMP/bump-cli/node_modules/.bin/tsx" scripts/bump-package-version.ts "${ARGS[@]}"
      # !WITH_GENESYS

      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            echo "tag=--tag $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        run: npm run build

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run tests
        run: npm test

      # WITH_GENESYS
      # Publish from a staging directory so package self-import rewrites never dirty the checkout.
      - name: Prepare and publish package
        id: publish-package
        run: |
          set -euo pipefail
          attempt=1
          while true; do
            STAGING_DIR="$RUNNER_TEMP/three-publish"
            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"

            npm pack --pack-destination "$STAGING_DIR"
            TARBALL=$(printf '%s\n' "$STAGING_DIR"/*.tgz)
            tar -xzf "$TARBALL" -C "$STAGING_DIR"

            node utils/publish/rewrite-addon-imports.js "$STAGING_DIR/package"
            if npm publish "$STAGING_DIR/package" --access public --provenance=false ${{ steps.dist-tag.outputs.tag }}; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after ${attempt} attempts"
              exit 1
            fi
            echo "Publish failed; bumping patch from local version (attempt ${attempt})"
            "$RUNNER_TEMP/bump-cli/node_modules/.bin/tsx" scripts/bump-package-version.ts . patch --from-local
            attempt=$((attempt + 1))
          done
          echo "published_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag published version
        uses: ./.github/actions/push-git-tag
        with:
          tag: ${{ steps.bump-version.outputs.package_name }}/${{ steps.publish-package.outputs.published_version }}
          message: Publish ${{ steps.bump-version.outputs.package_name }}@${{ steps.publish-package.outputs.published_version }} to npm
      # !WITH_GENESYS

      # 90 minutes covers the 3600s poll plus install overhead.
      - name: Verify published package
        timeout-minutes: 90
        env:
          PACKAGE_NAME: ${{ steps.bump-version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.publish-package.outputs.published_version }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGE_NAME" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "::error::package name and version are required"
            exit 1
          fi

          # Unauthenticated install. The publish token can see a version before
          # the public registry serves it, and npm validation can 404 that
          # document for a long time after publish succeeds.
          unset NODE_AUTH_TOKEN
          export NPM_CONFIG_USERCONFIG=/dev/null

          # Same wait as the monorepo verify-published-package action:
          # probe the version document, then install, backing off from 10s to 60s
          # for up to 3600s. Wait on the exact version, not the dist-tag.
          TIMEOUT_SECONDS=3600
          POLL_INTERVAL_SECONDS=10
          MAX_POLL_INTERVAL_SECONDS=60

          TEMP_DIR=$(mktemp -d)
          echo "Created temp directory: $TEMP_DIR"
          cleanup() { rm -rf "$TEMP_DIR"; }
          trap cleanup EXIT
          cd "$TEMP_DIR"
          npm init -y
          printf '%s\n' 'fetch-retries=0' > .npmrc

          deadline=$((SECONDS + TIMEOUT_SECONDS))
          interval=$POLL_INTERVAL_SECONDS
          if [ "$interval" -gt "$MAX_POLL_INTERVAL_SECONDS" ]; then
            interval=$MAX_POLL_INTERVAL_SECONDS
          fi
          attempt=0

          remaining() { echo $((deadline - SECONDS)); }

          sleep_until_retry() {
            local reason="$1"
            local left sleep_for
            left=$(remaining)
            if [ "$left" -le 0 ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for $PACKAGE_NAME@$PACKAGE_VERSION to become installable on npm ($reason)"
              if [ -f add.log ]; then
                echo "----- last npm install output -----"
                cat add.log
              fi
              exit 1
            fi
            sleep_for=$interval
            if [ "$sleep_for" -gt "$left" ]; then
              sleep_for=$left
            fi
            echo "$reason; attempt $attempt, elapsed ${SECONDS}s / ${TIMEOUT_SECONDS}s, waiting ${sleep_for}s..."
            sleep "$sleep_for"
            interval=$((interval * 2))
            if [ "$interval" -gt "$MAX_POLL_INTERVAL_SECONDS" ]; then
              interval=$MAX_POLL_INTERVAL_SECONDS
            fi
          }

          ENCODED_NAME=$(node -p 'encodeURIComponent(process.env.PACKAGE_NAME).replace(/%40/g, "@")')
          ENCODED_VERSION=$(node -p 'encodeURIComponent(process.env.PACKAGE_VERSION)')
          VERSION_URL="https://registry.npmjs.org/${ENCODED_NAME}/${ENCODED_VERSION}"
          echo "Waiting for npm to list $PACKAGE_NAME@$PACKAGE_VERSION (up to ${TIMEOUT_SECONDS}s)..."
          echo "Probing $VERSION_URL"
          while true; do
            attempt=$((attempt + 1))
            set +e
            http_code=$(curl -sS -L --max-time 30 -A "genesys-verify-published-package" -o npm-version.json -w '%{http_code}' "$VERSION_URL")
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = "200" ]; then
              echo "npm listed $PACKAGE_NAME@$PACKAGE_VERSION after ${SECONDS}s"
              break
            fi
            sleep_until_retry "Version metadata HTTP ${http_code:-000} (curl exit ${curl_status})"
          done

          interval=$POLL_INTERVAL_SECONDS
          RETRYABLE='E404|ETARGET|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|429 Too Many|502 Bad Gateway|503 Service|404 Not Found'

          echo "Installing $PACKAGE_NAME@$PACKAGE_VERSION (unauthenticated)..."
          while true; do
            attempt=$((attempt + 1))
            CACHE_DIR=$(mktemp -d)
            set +e
            npm install --cache "$CACHE_DIR" --prefer-online "$PACKAGE_NAME@$PACKAGE_VERSION" 2>&1 | tee add.log
            ADD_STATUS=${PIPESTATUS[0]}
            set -e
            rm -rf "$CACHE_DIR"
            if [ "$ADD_STATUS" -eq 0 ]; then
              echo "Package available and installed after ${SECONDS}s ($attempt attempts)"
              break
            fi
            if grep -qE "$RETRYABLE" add.log; then
              rm -rf node_modules package-lock.json
              sleep_until_retry "Registry has not fully published $PACKAGE_VERSION yet"
              continue
            fi
            echo "::error::npm install failed with a non-retryable error"
            exit 1
          done

          NODE_MODULES_PATH="node_modules/$PACKAGE_NAME"
          if [ ! -d "$NODE_MODULES_PATH" ]; then
            echo "Package was not installed correctly"
            exit 1
          fi
          INSTALLED_VERSION=$(node -p "require('./$NODE_MODULES_PATH/package.json').version")
          if [ "$INSTALLED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: expected $PACKAGE_VERSION, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "Successfully verified installation of $PACKAGE_NAME@$INSTALLED_VERSION"

          # WITH_GENESYS
          # Install a competing bare `three` alias to reproduce a multi-version consumer.
          # An untransformed addon would resolve this older package instead of its own release.
          npm install "three@npm:@gnsx/three@0.184.20"

          # Verify addons and the TSL entry point use the scoped package's exact module instance.
          PACKAGE_NAME="$PACKAGE_NAME" node --input-type=module <<'NODE'
          const THREE = await import(process.env.PACKAGE_NAME);
          const TSL = await import(`${process.env.PACKAGE_NAME}/tsl`);
          const WEBGPU = await import(`${process.env.PACKAGE_NAME}/webgpu`);
          const { GLTFLoader } = await import(`${process.env.PACKAGE_NAME}/addons/loaders/GLTFLoader.js`);

          if (!(new GLTFLoader() instanceof THREE.Loader)) {
            throw new Error('Published addon resolved a different Three.js module instance.');
          }
          if (TSL.If !== WEBGPU.TSL.If) {
            throw new Error('Published TSL entry point resolved a different WebGPU module instance.');
          }
          NODE
          # !WITH_GENESYS

      - name: Notify Slack
        if: always()
        run: |
          # Determine overall status
          JOB_STATUS="${{ job.status }}"
          PACKAGE_NAME="${{ steps.bump-version.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.publish-package.outputs.published_version }}"
          if [ -z "$PACKAGE_VERSION" ]; then
            PACKAGE_VERSION="${{ steps.bump-version.outputs.new_version }}"
          fi

          if [ "$JOB_STATUS" == "success" ]; then
            OVERALL_STATUS="✅ *$PACKAGE_NAME Publish Succeeded!*"
            COLOR="good"
          else
            OVERALL_STATUS="❌ *$PACKAGE_NAME Publish Failed!*"
            COLOR="danger"
          fi

          # Get commit info
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_SHA=$(git rev-parse --short HEAD)

          curl -X POST "${{ secrets.GENESYS_SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [
                {
                  \"color\": \"$COLOR\",
                  \"title\": \"$OVERALL_STATUS\",
                  \"text\": \"$PACKAGE_NAME publish workflow completed\",
                  \"fields\": [
                    {
                      \"title\": \"Version\",
                      \"value\": \"$PACKAGE_VERSION\",
                      \"short\": true
                    },
                    {
                      \"title\": \"Status\",
                      \"value\": \"$JOB_STATUS\",
                      \"short\": true
                    },
                    {
                      \"title\": \"Commit\",
                      \"value\": \"<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|$COMMIT_SHA: $COMMIT_MSG>\",
                      \"short\": false
                    },
                    {
                      \"title\": \"Author\",
                      \"value\": \"$COMMIT_AUTHOR\",
                      \"short\": true
                    }
                  ],
                  \"footer\": \"GitHub Actions\",
                  \"footer_icon\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                  \"actions\": [
                    {
                      \"type\": \"button\",
                      \"text\": \"View Workflow\",
                      \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"
